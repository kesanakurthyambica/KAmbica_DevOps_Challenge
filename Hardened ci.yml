name: Site-Release-CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: |
          python -m unittest discover -s tests

      - name: Verify model checksum
        run: |
          python -m unittest tests.test_manifest

  build:
    needs: validate

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t registry.site.local/eoir-stack:${GITHUB_SHA} .

      - name: Publish immutable image
        run: |
          echo "Publishing ${GITHUB_SHA}"
